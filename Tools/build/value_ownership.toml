value = "PyList_SetValue"
family = "list"
args = ["keep", "keep", "steal"]
result = "status"

[[row]]
object = "PyList_SET_ITEM"
value = "PyList_SET_VALUE"
family = "list"
args = ["keep", "keep", "steal"]
result = "status"

[[row]]
object = "_PyList_AppendTakeRef"
value = "_PyList_AppendTakeValue"
family = "list"
args = ["keep", "steal"]
result = "status"

[[row]]
object = "_PyList_AppendTakeRefListResize"
value = "_PyList_AppendTakeValue"
family = "list"
args = ["keep", "steal"]
result = "status"

[[row]]
object = "PyList_GetItemRef"
