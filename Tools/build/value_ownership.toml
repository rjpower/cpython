# The ownership table of the value-API waves (pyjit/design/value-api.md,
# R23; pyjit/design/proposals/value-api-v2a0.md, section 1.5).
#
# One [[row]] per object function that has a value form. Tools/build/
# value_sweep.py generates the Py_VALUE_COMPAT(<value>) mark of each row and
# rewrites the call sites the compiler then reports. Later waves add rows.
#
#   object   the object-form function, as declared in Include/
#   value    its value form: the mark's replacement and the script's callee
#   family   the wave family (list, tuple, dict, set, cell)
#   args     one word per argument of the object form, in order:
#              keep    passed through unchanged
#              borrow  an object the object form borrows; the value form
#                      borrows a value (PyValue_FromObjectBorrow(o), or
#                      _PyValue_FromObjectKnown(o) for a typed pointer)
#              steal   an object the object form consumes; the value form
#                      takes an owner (PyValue_PrepareOwned(o))
#              out     a PyObject ** that receives a new reference; the value
#                      form writes an owned PyValue. The script rewrites only
#                      a literal NULL; any other output is a worker's site
#              count   the arity of a variadic object form (PyTuple_Pack),
#                      an integer literal at the site; the remaining
#                      arguments are "borrow"
#   result   status  an int or void that carries no value
#            object  a new reference to an object of a fixed type (a tuple,
#                    a cell): unchanged
#            new     a new reference to any value; the value form returns an
#                    owned PyValue. A site is a worker's (P), unless it is
#                    passed straight to a steal argument of another row (M3)
#   form     call (default): value(args...)
#            pack: value(n, (PyValueBorrow[]){args...})
#   aliases  other names the compiler reports a site under (an object-like
#            macro that names the function)
#
# [[constructor]] rows are class R: in a function that returns a PyValue,
# "return object(...)" becomes "return value(...)" with the same arguments.

# --- list -----------------------------------------------------------------

[[row]]
object = "PyList_Append"
value = "PyList_AppendValue"
family = "list"
args = ["keep", "borrow"]
result = "status"

[[row]]
object = "PyList_Insert"
value = "PyList_InsertValue"
family = "list"
args = ["keep", "keep", "borrow"]
result = "status"

[[row]]
