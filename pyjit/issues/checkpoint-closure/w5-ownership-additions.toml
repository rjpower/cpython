# Manual twin inventory: deliberately ignored by value_sweep.load_table.
# The R27 static inventory checker must validate marks for these as well.

[[manual]]
object = "PyObject_GetOptionalAttr"
value = "_PyValue_GetOptionalAttr"
family = "attr"
reason = "PyObject ** output and int status become _PyStatusValue; transfer/close owned result by status"

[[manual]]
object = "_PyObject_LookupSpecial"
value = "_PyValue_LookupSpecial"
family = "attr"
reason = "owned PyObject * or NULL becomes _PyStatusValue; preserve missing-without-error distinction"

[[manual]]
object = "PyMapping_GetOptionalItem"
value = "_PyValue_GetOptionalItem"
family = "item"
reason = "PyObject ** output and int status become _PyStatusValue; preserve missing KeyError clearing"

[[manual]]
object = "PyIter_Next"
value = "_PyValue_IterNext"
family = "item"
reason = "owned PyObject * or NULL becomes _PyStatusValue with NEXT/RETURN/ERROR; preserve exception clearing"

[[manual]]
object = "PyIter_Send"
value = "_PyValue_Send"
family = "item"
reason = "PySendResult plus PyObject ** output becomes _PyStatusValue; preserve yielded versus returned value"

[[manual]]
object = "PyObject_Call"
value = "_PyValue_Call"
family = "call"
reason = "value twin adds PyThreadState * first parameter and returns owned PyValue"

[[manual]]
object = "PyObject_CallOneArg"
value = "_PyValue_CallOneArg"
family = "call"
reason = "value twin adds PyThreadState * first parameter and returns owned PyValue"

[[manual]]
object = "PyObject_Vectorcall"
value = "_PyValue_Vectorcall"
family = "call"
reason = "PyObject *const * argument window becomes const PyValue *; explicit value window lifetime required"

[[manual]]
object = "PyObject_CallNoArgs"
value = "_PyValue_CallNoArgs"
family = "call"
reason = "value twin adds PyThreadState * first parameter and returns owned PyValue"

